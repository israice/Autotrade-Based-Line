# run settings
delay: 0.5                          # Delay between execution cycles (in seconds)

# exchange settings
symbol: XRPUSDT                   # Trading pair symbol
buy_interval: 1m                  # Candle interval (e.g., 1m, 5m, 15m, 1h)
sell_interval: 3m                 # Candle interval for sell (e.g., 1m, 5m, 15m, 1h)
candles_limit: 2                  # Number of candles to fetch

# trade settings
START_AMOUNT: 0.2                 # USDT
SELL_ON_PERCENT_CHANGE: 0.010       # % каждые сколько процентов продавать
SELL_PERCENT_ON_CANDLE_ENDS: 100  # % сколько процентов всего продать?
